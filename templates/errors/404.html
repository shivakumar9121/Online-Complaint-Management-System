{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-primary mb-2">404</div>
    <h3 class="fw-bold mb-2">Page Not Found</h3>

    </a>
</div>
{% endblock %}
